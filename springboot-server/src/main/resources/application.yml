server:
  port: 8080

spring:
  application:
    name: placeprep-springboot-engine
  datasource:
    url: jdbc:h2:mem:placeprepdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

# Placement Prep Core Platform Settings
placeprep:
  platform:
    title: "PlacePrep Campus Placement Engine"
    version: "1.0.0"
    engine: "Spring Boot 3 + Java 21/23"
    environment: "Development & College Evaluation Mode"
